<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - Happynet</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h2>Set New Password</h2>
    <p class="auth-subtitle">Enter your new account password</p>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" minlength="8" required placeholder="At least 8 characters" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" minlength="8" required placeholder="Repeat new password" autocomplete="new-password" />
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">Update Password</button>
    </form>

    <div id="statusMsg" class="status-message"></div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-client.js';

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const statusMsg = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      if (newPassword !== confirmPassword) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      const { error } = await supabase.auth.updateUser({ password: newPassword });

      if (error) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      } else {
        statusMsg.style.color = 'green';
        statusMsg.textContent = 'Password updated successfully! Redirecting to login...';
        setTimeout(() => window.location.href = '/index.html', 2000);
      }
    });
  </script>
</body>
</html>
