<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Happynet</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h2>Create an Account</h2>
    <p class="auth-subtitle">Sign up to access the system</p>

    <form id="signupForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required placeholder="John Doe" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="8" required placeholder="At least 8 characters" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" minlength="8" required placeholder="Repeat password" autocomplete="new-password" />
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">Register Account</button>
    </form>

    <div id="statusMsg" class="status-message"></div>

    <div class="auth-footer">
      Already have an account? <a href="/index.html">Sign In</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-client.js';

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';
      statusMsg.textContent = '';

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName }
        }
      });

      if (error) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Account';
      } else if (data.session) {
        statusMsg.style.color = 'green';
        statusMsg.textContent = 'Account created successfully! Redirecting...';
        setTimeout(() => window.location.href = '/profile.html', 1500);
      } else {
        statusMsg.style.color = 'green';
        statusMsg.textContent = 'Account created! Please check your email to confirm your account.';
      }
    });
  </script>
</body>
</html>
