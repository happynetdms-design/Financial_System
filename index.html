<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Happynet — Profit First Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#132339;
  --ink-soft:#3B4B63;
  --paper:#F5F1E7;
  --card:#FFFDF8;
  --gold:#D9A441;
  --gold-deep:#B9822B;
  --good:#2F7A5C;
  --good-soft:#E4EFE8;
  --alert:#B23A2E;
  --alert-soft:#F5E4E1;
  --hair:#DED5C0;
  --muted:#7A7261;
  --radius:14px;
  --shadow:0 1px 2px rgba(19,35,57,.04), 0 6px 20px rgba(19,35,57,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.num{font-family:'IBM Plex Mono',monospace; font-weight:500; letter-spacing:-0.01em;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.app{display:flex; min-height:100vh;}

/* --- Sidebar --- */
.sidebar{
  width:240px; flex-shrink:0; background:var(--ink); color:#EFE9DA;
  display:flex; flex-direction:column; padding:22px 16px;
  position:sticky; top:0; height:100vh;
  border-right:1px solid rgba(217,164,65,.12);
}
.brand{display:flex; align-items:center; gap:11px; padding:4px 6px 24px;}
.brand-mark{
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  background:linear-gradient(155deg, var(--gold) 0%, var(--gold-deep) 100%);
  color:var(--ink); display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(217,164,65,.25);
}
.brand-text{font-family:'Fraunces',serif; font-weight:600; font-size:17px; line-height:1.1; color:#fff;}
.brand-text .accent{color:var(--gold);}
.brand-text .sublabel{display:block; font-family:'Inter'; font-weight:600; font-size:9.5px; letter-spacing:.14em; color:#8C93A6; text-transform:uppercase; margin-top:3px;}
.branch-switch{padding:0 2px 16px;}
.branch-switch select{
  width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#EFE9DA;
  border-radius:9px; padding:9px 10px; font-size:12.5px; font-weight:600; font-family:'Inter'; cursor:pointer;
}
.branch-switch select:focus{outline:1px solid var(--gold);}
nav{display:flex; flex-direction:column; gap:2px;}
nav button{
  all:unset; cursor:pointer; padding:10px 12px; border-radius:10px; font-size:13.5px;
  color:#B9C0D1; font-weight:500; display:flex; align-items:center; gap:11px;
  transition:background .15s, color .15s;
}
nav button svg{opacity:.75; transition:opacity .15s;}
nav button:hover{background:rgba(255,255,255,.06); color:#fff;}
nav button:hover svg{opacity:1;}
nav button.active{background:var(--gold); color:var(--ink); font-weight:600;}
nav button.active svg{opacity:1;}

.sidebar-widget{margin:20px 2px 0; padding:14px 14px 15px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:12px;}
.sidebar-widget-head{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:600; color:#D8D1BE; margin-bottom:11px;}
.mini-progress-row{display:flex; justify-content:space-between; font-size:11px; color:#9AA2B4; margin-bottom:4px;}
.mini-progress-row b{color:#EFE9DA; font-family:'IBM Plex Mono',monospace; font-weight:600;}
.mini-progress-track{height:5px; border-radius:3px; background:rgba(255,255,255,.09); overflow:hidden;}
.mini-progress-fill{height:100%; border-radius:3px;}

.sidebar-foot{margin-top:auto; padding-top:16px;}
.profile-chip{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:11px;
  border:1px solid rgba(255,255,255,.08); margin-top:8px;
}
.profile-avatar{
  width:32px; height:32px; border-radius:50%; background:var(--gold); color:var(--ink); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'Fraunces',serif;
}
.profile-info{flex:1; min-width:0;}
.profile-email{font-size:11.5px; color:#EFE9DA; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.profile-role{font-size:10px; color:#8C93A6; text-transform:capitalize; margin-top:1px;}
.sidebar-foot button{all:unset; cursor:pointer; color:#8C93A6; display:flex; padding:4px; border-radius:6px; transition:color .15s, background .15s;}
.sidebar-foot button:hover{color:#fff; background:rgba(255,255,255,.08);}

/* --- Main --- */
.main{flex:1; min-width:0; padding:30px 38px 80px; max-width:1220px;}
.topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; gap:16px; flex-wrap:wrap;
  padding-bottom:20px; border-bottom:1px solid var(--hair);}
.topbar h1{font-size:27px; margin:0 0 4px; font-weight:600;}
.topbar .sub{color:var(--muted); font-size:13.5px;}
.topbar-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.month-pill{
  background:var(--card); border:1px solid var(--hair); border-radius:100px; padding:7px 16px 7px 8px;
  font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:8px;
}
.month-pill .dot{width:26px; height:26px; border-radius:50%; background:var(--good-soft); color:var(--good); display:flex; align-items:center; justify-content:center;}
.month-pill.closed .dot{background:#EFE9D9; color:var(--muted);}

/* --- Cards / grid --- */
.grid{display:grid; gap:16px;}
.grid.kpi{grid-template-columns:repeat(auto-fit, minmax(240px,1fr));}
.card{
  background:var(--card); border:1px solid var(--hair); border-radius:var(--radius);
  padding:19px 21px; box-shadow:var(--shadow); transition:box-shadow .18s, transform .18s;
}
.card.kpi{position:relative; overflow:hidden;}
.card.kpi:hover{box-shadow:0 2px 4px rgba(19,35,57,.05), 0 14px 28px rgba(19,35,57,.09); transform:translateY(-1px);}
.card h3{margin:0 0 4px; font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; font-family:'Inter';}
.kpi-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
.kpi-icon{
  width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.kpi-icon.tone-gold{background:#F7EDD8; color:var(--gold-deep);}
.kpi-icon.tone-red{background:#FBE9E7; color:#B42318;}
.kpi-icon.tone-green{background:#E8F5E9; color:#1B7A3D;}
.kpi-icon.tone-navy{background:#E7EAF1; color:var(--ink-soft);}
.kpi-icon.tone-good{background:var(--good-soft); color:var(--good);}
.kpi .big{font-family:'IBM Plex Mono',monospace; font-size:29px; font-weight:600; margin:6px 0 6px; line-height:1;}
.kpi .foot{font-size:12.5px; color:var(--muted); line-height:1.5;}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:100px;}
.tag.good{background:var(--good-soft); color:var(--good);}
.tag.alert{background:var(--alert-soft); color:var(--alert);}
.tag.neutral{background:#EFE9D9; color:var(--ink-soft);}

/* signal bars — signature element */
.signal{display:flex; align-items:flex-end; gap:3px; height:22px;}
.signal i{width:5px; border-radius:1.5px; background:var(--hair); display:block;}
.signal i:nth-child(1){height:7px;} .signal i:nth-child(2){height:12px;}
.signal i:nth-child(3){height:17px;} .signal i:nth-child(4){height:22px;}
.signal.lit-1 i:nth-child(1){background:var(--alert);}
.signal.lit-2 i:nth-child(-n+2){background:var(--gold);}
.signal.lit-3 i:nth-child(-n+3){background:var(--gold);}
.signal.lit-4 i{background:var(--good);}

.narrative{
  position:relative; background:var(--ink); color:#EDE7D6; border-radius:var(--radius); padding:24px 26px 24px 62px;
  font-family:'Fraunces',serif; font-size:16.5px; line-height:1.6; font-weight:400; overflow:hidden;
}
.narrative::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse 320px 200px at 100% 0%, rgba(217,164,65,.14), transparent 60%);
}
.narrative-icon{
  position:absolute; left:24px; top:24px; width:28px; height:28px; border-radius:8px;
  background:rgba(217,164,65,.16); color:var(--gold); display:flex; align-items:center; justify-content:center;
}
.narrative b{color:var(--gold); font-weight:600;}

/* --- Tables --- */
.table-wrap{background:var(--card); border:1px solid var(--hair); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:left; padding:11px 14px; background:#EFE9D9; color:var(--ink-soft);
  font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; border-bottom:1px solid var(--hair);
}
tbody td{padding:10px 14px; border-bottom:1px solid #EFEADC; font-family:'IBM Plex Mono',monospace; font-size:13px;}
tbody td.txt{font-family:'Inter'; font-size:13.5px;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FBF8EF;}
.neg{color:var(--alert); font-weight:600;}
.pos{color:var(--good); font-weight:600;}
.empty-row td{color:var(--muted); font-style:italic; font-family:'Inter'; text-align:center; padding:22px;}

/* --- Forms --- */
.form-card{background:var(--card); border:1px solid var(--hair); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px;}
.form-card h3{margin:0 0 14px; font-size:15px;}
.form-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:12px;}
label{display:block; font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px;}
input,select,textarea{
  width:100%; border:1px solid var(--hair); background:#FFFFFF; border-radius:8px; padding:9px 11px;
  font-family:'Inter'; font-size:13.5px; color:var(--ink); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,164,65,.18);}
input[type=checkbox]{width:auto; accent-color:var(--gold-deep);}
.check-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);}
.btn{
  all:unset; cursor:pointer; background:var(--ink); color:#F5F1E7; font-weight:600; font-size:13.5px;
  padding:10px 18px; border-radius:9px; display:inline-flex; align-items:center; gap:6px; transition:opacity .15s;
}
.btn:hover{opacity:.85;}
.btn.gold{background:var(--gold); color:var(--ink);}
.btn.ghost{background:transparent; border:1px solid var(--hair); color:var(--ink-soft);}
.btn.danger{background:var(--alert); color:#fff;}
.btn.sm{padding:6px 12px; font-size:12.5px;}
.err-msg{background:var(--alert-soft); color:var(--alert); border-radius:8px; padding:9px 13px; font-size:13px; margin-top:10px; font-weight:500;}
.hint{font-size:12px; color:var(--muted); margin-top:4px;}
.import-summary{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}

.section-head{display:flex; justify-content:space-between; align-items:center; margin:26px 0 12px;}
.section-head:first-of-type{margin-top:0;}
.section-head h2{font-size:16.5px; margin:0; font-weight:600; color:var(--ink-soft); font-family:'Inter';}
.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.toolbar select,.toolbar input{width:auto; padding:7px 10px; font-size:12.5px;}

.filters{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.summary-strip{display:flex; gap:22px; padding:14px 20px; background:#EFE9D9; border-radius:var(--radius); margin-bottom:14px; flex-wrap:wrap;}
.summary-strip .item{display:flex; flex-direction:column; gap:2px;}
.summary-strip .item span{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.summary-strip .item b{font-family:'IBM Plex Mono',monospace; font-size:16px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(19,35,57,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:var(--card); border-radius:var(--radius); padding:26px 28px; max-width:480px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{margin-top:0;}
.modal .totals{background:#EFE9D9; border-radius:10px; padding:14px 16px; margin:14px 0; font-size:13.5px;}
.modal .totals div{display:flex; justify-content:space-between; padding:3px 0;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px;}

.chart-box{background:var(--card); border:1px solid var(--hair); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px;}
.chart-box h3{font-size:13px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
.chart-canvas-wrap{height:220px; position:relative;}

.mobile-tabs{display:none;}
@media (max-width: 880px){
  .sidebar{display:none;}
  .main{padding:18px 16px 90px;}
  .mobile-tabs{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); z-index:50;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom)); overflow-x:auto; gap:2px;
  }
  .mobile-tabs button{
    all:unset; flex:1; min-width:64px; text-align:center; color:#B7AE99; font-size:10.5px; font-weight:600;
    padding:8px 4px; border-radius:8px; cursor:pointer;
  }
  .mobile-tabs button.active{background:var(--gold); color:var(--ink);}
  .form-row{grid-template-columns:1fr 1fr;}
}
@media (max-width:520px){
  .form-row{grid-template-columns:1fr;}
  .topbar{flex-direction:column;}
}
.quick-fab{display:none;}

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#D8D1BE; border-radius:6px;}

.pf-bucket-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-top:14px;}
.pf-bucket{padding:16px 17px; border-radius:12px; background:var(--card); border:1px solid var(--hair); box-shadow:var(--shadow); position:relative; overflow:hidden;}
.pf-bucket::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tone,var(--gold));}
.pf-bucket-icon{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; background:color-mix(in srgb, var(--tone,var(--gold)) 16%, transparent); color:var(--tone,var(--gold-deep));}
.pf-bucket .label{font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.pf-bucket .amt{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; margin-top:5px;}

.loading-screen{display:flex; align-items:center; justify-content:center; height:100vh; color:var(--muted); font-family:'Fraunces',serif; font-size:15px;}

/* --- Login (split screen) --- */
.login-wrap{min-height:100vh; display:flex; background:var(--ink);}
.login-hero{
  flex:1 1 54%; position:relative; overflow:hidden; padding:56px 60px;
  display:flex; flex-direction:column; justify-content:space-between;
  background:
    radial-gradient(ellipse 620px 480px at 4% -6%, rgba(217,164,65,.20), transparent 60%),
    linear-gradient(160deg, #0F2038 0%, #0B1830 55%, #0A1526 100%);
  color:#F2EFE4;
}
.login-hero-rings{position:absolute; left:-160px; bottom:-160px; width:520px; height:520px;
  border-radius:50%; border:1px solid rgba(217,164,65,.16); pointer-events:none;}
.login-hero-rings::before{content:''; position:absolute; inset:60px; border-radius:50%; border:1px solid rgba(217,164,65,.12);}
.login-hero-rings::after{content:''; position:absolute; inset:120px; border-radius:50%; border:1px solid rgba(217,164,65,.10);}

.login-logo{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
.login-logo-mark{font-size:30px; line-height:1;}
.login-logo-word{font-family:'Fraunces',serif; font-weight:700; font-size:26px; letter-spacing:-.01em;}
.login-logo-word b{color:var(--gold); font-weight:700;}
.login-logo-sub{display:flex; align-items:center; gap:10px; margin-top:6px;}
.login-logo-sub span{font-size:11px; letter-spacing:.22em; color:#B7AE99; font-weight:600;}
.login-logo-sub i{display:block; width:26px; height:1px; background:var(--gold-deep);}

.login-hero-mid{position:relative; z-index:1; margin:44px 0 0;}
.login-headline{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,3.6vw,42px); line-height:1.12; margin:0 0 16px;}
.login-headline i{display:block; width:52px; height:3px; background:var(--gold); border-radius:2px; margin:16px 0 18px;}
.login-hero-sub{font-size:15px; line-height:1.6; color:#C9C2AE; max-width:400px; margin:0 0 34px;}

.login-features{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; max-width:520px;}
.login-feature{display:flex; flex-direction:column; align-items:flex-start; gap:10px;}
.login-feature-icon{
  width:52px; height:52px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  background:rgba(217,164,65,.10); border:1px solid rgba(217,164,65,.28);
}
.login-feature-icon svg{width:22px; height:22px;}
.login-feature span{font-size:12.5px; font-weight:600; color:#E7E2D2; line-height:1.3;}

.login-hero-chart{position:relative; z-index:1; height:120px; margin-top:36px;}
.login-security{
  position:relative; z-index:1; margin-top:18px; display:flex; align-items:center; gap:12px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.10); border-radius:12px;
  padding:12px 16px; max-width:420px; backdrop-filter:blur(2px);
}
.login-security-icon{
  width:34px; height:34px; border-radius:50%; background:var(--ink); border:1px solid var(--gold-deep);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.login-security-icon svg{width:16px; height:16px;}
.login-security span{font-size:12.5px; color:#D7D2C2; line-height:1.4;}

.login-panel{flex:1 1 46%; display:flex; align-items:center; justify-content:center; padding:40px; background:#F4F1EA;}
.login-card{background:#fff; border-radius:20px; padding:40px 38px; width:100%; max-width:420px; box-shadow:0 30px 70px rgba(9,16,30,.28);}
.login-card-icon{
  width:64px; height:64px; border-radius:50%; background:var(--ink); display:flex; align-items:center;
  justify-content:center; margin:0 auto 18px;
}
.login-card-icon svg{width:26px; height:26px;}
.login-title{font-family:'Fraunces',serif; font-weight:700; font-size:23px; color:var(--ink); margin:0 0 4px; text-align:center;}
.login-sub{color:var(--muted); font-size:13px; margin:0 0 26px; text-align:center;}
.login-card label{margin-top:14px; text-align:left;}
.login-card label:first-of-type{margin-top:0;}
.login-input-wrap{position:relative;}
.login-input-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); pointer-events:none;}
.login-input-wrap input{padding-left:38px;}
.login-input-wrap button.toggle-pw{
  all:unset; position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer;
  color:var(--muted); display:flex;
}
.login-input-wrap button.toggle-pw svg{position:static; transform:none;}
.login-row-between{display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:12.5px;}
.login-row-between a{color:var(--ink-soft); font-weight:600; text-decoration:none;}
.login-row-between a:hover{text-decoration:underline;}
.btn.full{width:100%; justify-content:center; margin-top:20px; display:flex; align-items:center; gap:8px;}
.login-divider{display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;}
.login-divider i{flex:1; height:1px; background:var(--hair);}
.btn.google{
  width:100%; background:#fff; border:1px solid var(--hair); color:var(--ink-soft); font-weight:600; font-size:13.5px;
  display:flex; align-items:center; justify-content:center; gap:10px; padding:12px; border-radius:10px; cursor:pointer;
}
.btn.google:hover{background:#FAFAF8;}
.login-foot{margin-top:20px; font-size:12.5px; color:var(--muted); text-align:center;}
.login-foot a{color:var(--gold-deep); font-weight:600; cursor:pointer;}
@media (max-width:880px){
  .login-wrap{flex-direction:column;}
  .login-hero{flex:none; padding:40px 28px;}
  .login-features{grid-template-columns:repeat(2,1fr);}
  .login-hero-chart{display:none;}
  .login-panel{flex:none; padding:28px;}
}

.save-badge{font-size:10.5px; margin-top:6px; letter-spacing:.03em;}

/* ---------------- API layer (talks to Netlify Functions only) ---------------- */
const SESSION_KEY = 'happynet_session';

function getSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
  catch(e){ return null; }
}
function setSession(s){
  if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
  else localStorage.removeItem(SESSION_KEY);
}

async function apiLogin(email, password){
  const res = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email, password })
  });
  const body = await res.json();
  if(!res.ok) throw new Error(body.error || 'Sign in failed.');
  setSession(body);
  return body;
}

async function apiRefresh(){
  const s = getSession();
  if(!s || !s.refresh_token) return false;
  try{
    const res = await fetch('/api/refresh', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if(!res.ok) { setSession(null); return false; }
    const body = await res.json();
    setSession(body);
    return true;
  }catch(e){ return false; }
}

async function apiLogout(){
  const s = getSession();
  try{
    await fetch('/api/logout', {
      method:'POST', headers:{'Authorization':'Bearer '+(s ? s.access_token : '')}
    });
  }catch(e){ /* ignore — clear local session regardless */ }
  setSession(null);
}

// Wraps fetch to /api/*: attaches the bearer token and retries once after a
// silent refresh if the token turned out to be expired.
async function apiFetch(path, options={}, _retried){
  const s = getSession();
  const headers = Object.assign({}, options.headers, { 'Authorization':'Bearer '+(s ? s.access_token : '') });
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if(res.status === 401 && !_retried){
    const refreshed = await apiRefresh();
    if(refreshed) return apiFetch(path, options, true);
  }
  return res;
}

async function apiGetState(){
  const res = await apiFetch('/api/state', { method:'GET' });
  if(!res.ok) throw new Error('unauthorized');
  const body = await res.json();
  return body.data || {};
}

async function apiSaveState(data){
  const res = await apiFetch('/api/state', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ data })
  });
  if(!res.ok) throw new Error('save failed');
  return true;
}

// Per-branch home for categories/monthlyArchive/closedMonths — see
// supabase/branch_misc_state.sql for why this exists separately from
// apiGetState()/apiSaveState() above, which still hit the old single-row
// /api/state purely as a whole-app mirror/rollback point.
async function apiGetBranchMisc(branchId){
  const res = await apiFetch('/api/branch-state?branch_id=' + branchId, { method:'GET' });
  if(!res.ok) throw new Error('Could not load branch data.');
  const body = await res.json();
  return body.data || {};
}
async function apiSaveBranchMisc(branchId, data){
  const res = await apiFetch('/api/branch-state', {
    method:'POST', headers: JSONH,
    body: JSON.stringify({ branch_id: branchId, data })
  });
  if(!res.ok) throw new Error('Could not save branch data.');
  return true;
}


let supabaseClient;
async function loadSupabaseClient(){
  if(supabaseClient) return supabaseClient;
  const res = await fetch('/api/auth-config');
  if(!res.ok) throw new Error('Unable to load Supabase config.');
  const data = await res.json();
  if(!data.SUPABASE_URL || !data.SUPABASE_ANON_KEY) throw new Error('Supabase client config is missing.');
  supabaseClient = window.supabase.createClient(data.SUPABASE_URL, data.SUPABASE_ANON_KEY, {
    auth: { autoRefreshToken:false, persistSession:false }
  });
  return supabaseClient;
}

async function handleOAuthCallback(){
  try{
    const supabase = await loadSupabaseClient();
    const { data, error } = await supabase.auth.getSessionFromUrl({ storeSession:false });
    if(error){
      console.warn('OAuth callback:', error.message || error);
      return false;
    }
    if(data && data.session){
      const { access_token, refresh_token, expires_at, user } = data.session;
      setSession({
        access_token,
        refresh_token,
        expires_at,
        user: { id: user.id, email: user.email, role: 'viewer' }
      });
      window.history.replaceState({}, '', window.location.pathname);
      return true;
    }
  }catch(e){
    console.warn('OAuth callback failed', e);
  }
  return false;
}

async function signInWithGoogle(){
  const googleBtn = document.getElementById('google-signin');
  if(!googleBtn) return;
  const originalLabel = googleBtn.innerHTML;
  googleBtn.disabled = true;
  googleBtn.innerHTML = 'Redirecting…';
  try{
    const supabase = await loadSupabaseClient();
    const { data, error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin }
    });
    if(error) throw error;
    if(data && data.url){
      window.location = data.url;
      return;
    }
    throw new Error('Unable to start Google sign-in.');
  }catch(e){
    alert('Google sign-in failed: '+(e.message || e));
    googleBtn.disabled = false;
    googleBtn.innerHTML = originalLabel;
  }
}

const JSONH = { 'Content-Type':'application/json' };

async function apiList(path, branchId, extraQuery){
  const qs = new URLSearchParams(Object.assign({ branch_id: branchId }, extraQuery||{}));
  const res = await apiFetch(path + '?' + qs.toString(), { method:'GET' });
  if(!res.ok) throw new Error('Failed to load ' + path);
  return res.json();
}
async function apiCreate(path, body){
  const res = await apiFetch(path, { method:'POST', headers: JSONH, body: JSON.stringify(body) });
  if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error || ('Create failed: ' + path)); }
  return res.json();
}
async function apiUpdate(path, body){
  const res = await apiFetch(path, { method:'PATCH', headers: JSONH, body: JSON.stringify(body) });
  if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error || ('Update failed: ' + path)); }
  return res.json();

/* ---------------- CSV export (Phase 5) ---------------- */
function csvEscape(v){
  const s = v===null||v===undefined ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCsv(headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  for(const row of rows) lines.push(row.map(csvEscape).join(','));
  return lines.join('\r\n');
}
function downloadText(filename, text, mime){
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let attachmentsState = { targetType:null, targetId:null, items:null, loading:false, error:null };

async function openAttachments(entityType, entityId){
  attachmentsState = { targetType: entityType, targetId: entityId, items: null, loading: true, error: null };
  render();
  try{
    const res = await apiList('/api/attachments', state.branchId, { entity_type: entityType, entity_id: entityId });
    attachmentsState.items = res.attachments || [];
  }catch(e){
    attachmentsState.items = [];
    attachmentsState.error = e.message;
  }
  attachmentsState.loading = false;
  render();
}
function closeAttachments(){
  attachmentsState = { targetType:null, targetId:null, items:null, loading:false, error:null };
  render();
}
async function uploadAttachment(entityType, entityId, file){
  if(!file) return;
  const dataUrl = await new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = () => rej(new Error('Could not read that file.'));
    reader.readAsDataURL(file);
  });
  const base64 = dataUrl.split(',')[1] || '';
  attachmentsState.loading = true; render();
  try{
    await apiCreate('/api/attachments', {
      branch_id: state.branchId, entity_type: entityType, entity_id: entityId,
      file_name: file.name, content_type: file.type || 'application/octet-stream', data_base64: base64
    });
    await openAttachments(entityType, entityId); // refresh the list with the new file included
  }catch(e){
    attachmentsState.loading = false;
    attachmentsState.error = e.message;
    render();
  }
}
async function deleteAttachment(id){
  attachmentsState.loading = true; render();
  try{
    await apiRemove('/api/attachments', { branch_id: state.branchId, id });
    await openAttachments(attachmentsState.targetType, attachmentsState.targetId);
  }catch(e){
    attachmentsState.loading = false;
    attachmentsState.error = e.message;
    render();
  }
}
function attachmentsPanelHtml(){
  if(!attachmentsState.targetId) return '';
  const { items, loading, error } = attachmentsState;
  return `<div class="panel" style="margin:10px 0;">
    <div class="section-head"><h3 style="margin:0;">Receipts / attachments</h3><button class="btn ghost sm" data-close-attachments>Close</button></div>
    ${error ? `<div class="hint" style="color:#c0392b;">${error}</div>` : ''}
    ${loading ? '<span class="hint">Working…</span>' :
      (items && items.length
        ? items.map(a => `<div class="item"><a href="${a.url || '#'}" target="_blank" rel="noopener">${(a.storage_path||'').split('/').pop()}</a> ${canWrite() ? `<button class="btn ghost sm" data-del-attachment="${a.id}">Remove</button>` : ''}</div>`).join('')
        : '<span class="hint">No attachments yet.</span>')}
    ${canWrite() ? `<div style="margin-top:8px;"><input type="file" id="attachment-file-input" accept="image/*,.pdf"></div>` : ''}
  </div>`;
}
function wireAttachmentsPanel(){
  const closeBtn = document.querySelector('[data-close-attachments]');
  if(closeBtn) closeBtn.addEventListener('click', closeAttachments);
  document.querySelectorAll('[data-del-attachment]').forEach(b => b.addEventListener('click', () => {

  }));

  if(fileInput) fileInput.addEventListener('change', (ev) => {
    uploadAttachment(attachmentsState.targetType, attachmentsState.targetId, ev.target.files[0]);
  });
}

      method:'POST', headers: JSONH,

// Which local array maps to which endpoint, and how a local record turns
// into the shape that endpoint expects. Client-generated uuid() ids are
// sent as-is on create, so a record's id is stable from the moment it's
// added in the UI — no server round trip needed before it can be
// edited/deleted again.
const CORE_ENTITY_CONFIG = {
  dailyRevenue: {
    path: '/api/revenue',
    toApi: r => ({ id:r.id, branch_id: state.branchId, entry_date:r.date, amount_kes:Number(r.revenue_kes)||0, notes:r.notes||null })
  },
  expenses: {
    path: '/api/expenses',
    toApi: e => ({ id:e.id, branch_id: state.branchId, expense_date:e.date, txn_ref:e.txn_ref||null,
      account_name:e.account_used||null, category_name:e.category||null,
      description:e.description||null, paid_to:e.paid_to||null,
      amount_kes:Number(e.amount_kes)||0, charges_kes:Number(e.charges_kes)||0, owner_funded:!!e.owner_funded,
      status:e.status||'posted' })
  },
  loans: {
    path: '/api/loans',
    toApi: l => ({ id:l.id, branch_id: state.branchId, debt_name:l.debt_name, lender:l.lender||null,
      original_principal_kes:Number(l.original_principal_kes)||0, current_balance_kes:Number(l.current_balance_kes)||0,
      annual_interest_rate_pct:Number(l.annual_interest_rate_pct)||0, start_date:l.start_date||null,
      min_monthly_payment_kes:Number(l.min_monthly_payment_kes)||0, status:l.status||'ACTIVE' })
  },
  // Balance math (loan.current_balance_kes) is computed client-side, same
  // as this app already did — syncing the 'loans' array separately carries
  // that updated balance server-side, so this endpoint doesn't touch it.
  loanPayments: {
    path: '/api/loan-payments',
    toApi: p => ({ id:p.id, branch_id: state.branchId, loan_id:p.loan_id, payment_date:p.date, amount_kes:Number(p.amount_kes)||0, note:p.note||null })
  },

      estimated_amount_kes:Number(t.estimated_amount_kes)||0, filing_authority:t.filing_authority||null, notes:t.notes||null })
  }
};

function snapshotCore(){
  const s = {};
  for(const key of Object.keys(CORE_ENTITY_CONFIG)) s[key] = JSON.parse(JSON.stringify(state[key] || []));
  s.settings = JSON.parse(JSON.stringify(state.settings));
  return s;
}

async function syncEntityArray(key){
  const cfg = CORE_ENTITY_CONFIG[key];
  const current = state[key] || [];
  const prior = (lastSynced && lastSynced[key]) || [];
  const priorById = new Map(prior.map(x=>[x.id,x]));
  const currentIds = new Set(current.map(x=>x.id));
  const ops = [];

  for(const rec of current){
    const before = priorById.get(rec.id);
    if(!before){
      ops.push(apiCreate(cfg.path, cfg.toApi(rec)));
    } else if(JSON.stringify(before) !== JSON.stringify(rec)){
      ops.push(apiUpdate(cfg.path, cfg.toApi(rec)));
    }
  }
  for(const rec of prior){
    if(!currentIds.has(rec.id)){
      ops.push(apiRemove(cfg.path, { branch_id: state.branchId, id: rec.id }));
    }
  }
  await Promise.all(ops);
}

async function syncSettings(){
  const s = state.settings;
  const before = lastSynced ? lastSynced.settings : null;
  if(before && JSON.stringify(before) === JSON.stringify(s)) return;
  await apiPutSettings({
    branch_id: state.branchId,
    pct_profit: s.pct_profit, pct_owner_debt: s.pct_owner_debt, pct_tax: s.pct_tax, pct_opex: s.pct_opex,
    debt_paydown_split_pct: s.debt_paydown_split_pct,
    monthly_revenue_target_kes: s.monthly_revenue_target_kes,
    opening_opex_account_balance_kes: s.opening_opex_account_balance_kes
  });
}

    })),
    monthlyArchive: (miscData && miscData.monthlyArchive) || [],
    closedMonths: (miscData && miscData.closedMonths) || [],
    categories: (miscData && miscData.categories && miscData.categories.length) ? miscData.categories : d.categories,

function queueSave(){
  clearTimeout(saveTimer);
  saveStatus = 'saving'; renderSaveBadge();
  saveTimer = setTimeout(async () => {
    try{
      await Promise.all([
        syncEntityArray('dailyRevenue'),
        syncEntityArray('expenses'),
        syncEntityArray('loans'),
        syncEntityArray('loanPayments'),
        syncEntityArray('taxObligations'),
        syncSettings(),
        // Real per-branch home for these three — this is what the UI
        // actually reads back on next load (see apiGetBranchMisc above).
        apiSaveBranchMisc(state.branchId, {
          categories: state.categories, monthlyArchive: state.monthlyArchive, closedMonths: state.closedMonths
        }),
        // /api/state's POST fully REPLACES the stored blob rather than
        // merging — so this keeps writing the complete state (not just
        // categories/archive/closedMonths) to preserve app_state as a
        // whole-app mirror/rollback point. NOTE: app_state is a single
        // global row, not branch-scoped, so across multiple branches this
        // mirror only ever reflects whichever branch saved most recently —
        // it's a rollback safety net, not a per-branch source of truth.
        apiSaveState({
          dailyRevenue: state.dailyRevenue, expenses: state.expenses, loans: state.loans,
          loanPayments: state.loanPayments, taxObligations: state.taxObligations,
          settings: state.settings, categories: state.categories,
          monthlyArchive: state.monthlyArchive, closedMonths: state.closedMonths
        })
      ]);
      lastSynced = snapshotCore();
      saveStatus = 'saved';
    } catch(e){
      console.error('save failed', e);
      saveStatus = 'error';
    }
    renderSaveBadge();
  }, 600);
}

function renderSaveBadge(){
  const el = document.getElementById('save-badge');
  if(!el) return;
  const map = { idle:'', saving:'Saving…', saved:'Saved', error:'Save failed — check connection' };
  el.textContent = map[saveStatus] || '';
  el.className = 'save-badge ' + saveStatus;
}

/* ---------------- Derived / business logic ---------------- */

function pf(revenue){
  const s = state.settings;
  return {
    profit: revenue * s.pct_profit/100,
    owner_debt: revenue * s.pct_owner_debt/100,
    tax: revenue * s.pct_tax/100,
    opex: revenue * s.pct_opex/100
  };
}

function currentOpenMonth(){
  const active = state.dailyRevenue
    .map(r => monthKey(r.date))
    .filter(m => !state.closedMonths.includes(m));
  if(active.length === 0) return monthKey(todayISO());
  return active.sort().slice(-1)[0];
}

function revenueForMonth(ym){ return state.dailyRevenue.filter(r => monthKey(r.date) === ym); }
// Pending-approval and rejected expenses are real rows (visible, editable,
// approvable) but shouldn't move any money total until a Branch Manager or
// Head Office approves them — this is the one place that filter needs to
// live, since every other total is built from these two functions.
function postedExpenses(){ return state.expenses.filter(e => e.status !== 'pending_approval' && e.status !== 'rejected'); }
function statusTag(status){
  if(status==='pending_approval') return `<span class="tag neutral" style="background:#F7EDD8; color:var(--gold-deep);">Pending</span>`;
  if(status==='rejected') return `<span class="tag alert">Rejected</span>`;
  return `<span class="tag good">Posted</span>`;
}
async function approveExpense(id){
  try{
    await apiUpdate('/api/expenses', { branch_id: state.branchId, id, status:'posted', approve:true });
    const rec = state.expenses.find(e=>e.id===id);
    if(rec) rec.status = 'posted';
    lastSynced.expenses = JSON.parse(JSON.stringify(state.expenses));
    render();
  }catch(e){ alert('Could not approve: '+e.message); }
}
async function rejectExpense(id){
  try{
    await apiUpdate('/api/expenses', { branch_id: state.branchId, id, status:'rejected' });
    const rec = state.expenses.find(e=>e.id===id);
    if(rec) rec.status = 'rejected';
    lastSynced.expenses = JSON.parse(JSON.stringify(state.expenses));
    render();
  }catch(e){ alert('Could not reject: '+e.message); }
}
function expensesForMonth(ym){ return postedExpenses().filter(e => monthKey(e.date) === ym); }

function grossExpenseOn(date){ return postedExpenses().filter(e=>e.date===date).reduce((s,e)=>s+e.amount_kes+e.charges_kes,0); }
function ownerFundedOn(date){ return postedExpenses().filter(e=>e.date===date && e.owner_funded).reduce((s,e)=>s+e.amount_kes+e.charges_kes,0); }
function netExpenseOn(date){ return grossExpenseOn(date) - ownerFundedOn(date); }

function monthTotals(ym){
  const revRows = revenueForMonth(ym);
  const expRows = expensesForMonth(ym);
  const totalRevenue = revRows.reduce((s,r)=>s+r.revenue_kes,0);
  const grossOpex = expRows.reduce((s,e)=>s+e.amount_kes+e.charges_kes,0);
  const ownerFunded = expRows.filter(e=>e.owner_funded).reduce((s,e)=>s+e.amount_kes+e.charges_kes,0);
  const netOpex = grossOpex - ownerFunded;
  const alloc = pf(totalRevenue);
  const daysElapsed = revRows.length;
  const dim = daysInMonth(ym);
  return { totalRevenue, grossOpex, ownerFunded, netOpex, alloc, daysElapsed, dim, revRows, expRows };
}

function dashboardData(){
  const ym = currentOpenMonth();
  const t = monthTotals(ym);
  const target = state.settings.monthly_revenue_target_kes;
  const paceTarget = target * (t.daysElapsed / t.dim);
  const revenuePacePct = paceTarget > 0 ? (t.totalRevenue / paceTarget) * 100 : 0;
  const opexPacePct = t.alloc.opex > 0 ? (t.netOpex / t.alloc.opex) * 100 : 0;
  const projRevenue = t.daysElapsed > 0 ? (t.totalRevenue / t.daysElapsed) * t.dim : 0;
  const projOpex = t.daysElapsed > 0 ? (t.netOpex / t.daysElapsed) * t.dim : 0;
  const overspent = t.netOpex > t.alloc.opex;
  const opexVariance = t.alloc.opex - t.netOpex;
  return { ym, ...t, target, revenuePacePct, opexPacePct, projRevenue, projOpex, overspent, opexVariance };
}

function narrativeText(d){
  const monthName = monthLabel(d.ym);
  const revStatus = d.revenuePacePct >= 100 ? 'ahead of pace' : d.revenuePacePct >= 85 ? 'close to pace' : 'behind pace';
  const opexStatus = d.overspent ? `overspent by ${KES(Math.abs(d.opexVariance))}` : `within budget with ${KES(d.opexVariance)} left`;
  const projLine = d.projRevenue >= d.target
    ? `If this pace holds, ${monthName} should close above the ${KES(d.target)} target.`
    : `If this pace holds, ${monthName} will land around ${KES(d.projRevenue)}, short of the ${KES(d.target)} target.`;
  return `Day ${d.daysElapsed} of ${d.dim} in ${monthName}: revenue is ${revStatus} at ${d.revenuePacePct.toFixed(0)}% of target pace, `+
    `and Operating Expenses are ${opexStatus} against the ${KES(d.alloc.opex)} allocated so far. ${projLine} `+
    `Projected month-end OpEx sits at ${KES(d.projOpex)}.`;
}

function signalLevel(pct){
  if(pct >= 100) return 4;
  if(pct >= 80) return 3;
  if(pct >= 50) return 2;
  return 1;
}

function loanSummary(){
  const totalOriginal = state.loans.reduce((s,l)=>s+Number(l.original_principal_kes||0),0);
  const totalBalance = state.loans.reduce((s,l)=>s+Number(l.current_balance_kes||0),0);
  const pctCleared = totalOriginal > 0 ? ((totalOriginal-totalBalance)/totalOriginal)*100 : 0;
  const ym = currentOpenMonth();
  const t = monthTotals(ym);
  const availableThisMonth = t.alloc.owner_debt * (state.settings.debt_paydown_split_pct/100);
  // average monthly paydown across months with payments
  const byMonth = {};
  state.loanPayments.forEach(p => { const m = monthKey(p.date); byMonth[m]=(byMonth[m]||0)+Number(p.amount_kes||0); });
  const months = Object.keys(byMonth);
  const avgMonthly = months.length ? Object.values(byMonth).reduce((a,b)=>a+b,0)/months.length : 0;
  let projectedDate = 'Not enough data yet';
  if(avgMonthly > 0 && totalBalance > 0){
    const monthsLeft = Math.ceil(totalBalance/avgMonthly);
    const d = new Date(); d.setMonth(d.getMonth()+monthsLeft);
    projectedDate = d.toLocaleString('en-US',{month:'long',year:'numeric'});
  } else if(totalBalance <= 0 && state.loans.length){
    projectedDate = 'Debt-free';
  }
  return { totalOriginal, totalBalance, pctCleared, availableThisMonth, avgMonthly, projectedDate };
}

function parseCSVRobust(text){
  const rows=[]; let row=[], field='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(quoted){
      if(c==='"' && n==='"'){field+='"';i++;}
      else if(c==='"') quoted=false;
      else field+=c;
    }else{
      if(c==='"') quoted=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field='';}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers=rows[0].map(x=>String(x||'').trim());
  return rows.slice(1).filter(r=>r.some(x=>String(x||'').trim()!=='')).map(r=>{
    const o={}; headers.forEach((h,i)=>o[h]=r[i]??''); return o;
  });
}
function parseTendeCSV(text){
  return rowsToObjects(parseCSVRobust(text)).map(r=>({
    source_ref:r['REF'], ref:r['REF'], date_initiated:r['DATE INITIATED'],
    service:r['SERVICE'], amount:r['AMOUNT'], charge:r['CHARGE'], receiver:r['RECEIVER'],
    name:r['NAME'], remark:r['REMARK'], ref_no:r['REF NO'], status:r['STATUS'],
    status_message:r['STATUS MESSAGE']
  }));
}
function parseUtilityCSV(text){
  const rows=parseCSVRobust(text);
  const headerIndex=rows.findIndex(r=>String(r[0]||'').trim()==='Receipt No.');
  if(headerIndex<0) throw new Error('This does not look like an Organization Utility Account export.');
  return rowsToObjects(rows.slice(headerIndex)).map(r=>({
    source_ref:r['Receipt No.'], receipt_no:r['Receipt No.'],
    completion_time:r['Completion Time'], details:r['Details'],
    transaction_status:r['Transaction Status'], paid_in:r['Paid In'],
    withdrawn:r['Withdrawn'], reason_type:r['Reason Type'],
    other_party_info:r['Other Party Info'], linked_transaction_id:r['Linked Transaction ID']
  }));
}
async function handleFinancialImportFiles(files){
  const status=document.getElementById('financial-import-status');
  if(!files.length) return;
  status.innerHTML='Processing files…';
  const reports=[];
  try{
    for(const file of files){
      const text=await file.text();
      const lower=file.name.toLowerCase();
      let source, rows;
      if(lower.includes('utilityaccount') || text.includes('Utility Account to Organization Settlement Account')) {
        source='organization_utility'; rows=parseUtilityCSV(text);
      } else if(lower.includes('tende') || text.includes('DATE INITIATED') && text.includes('SERVICE')) {
        source='tende'; rows=parseTendeCSV(text);
      } else throw new Error(`${file.name}: unsupported financial export.`);
      const r=await importFinancialSource(source,file.name,rows);
      reports.push(`${file.name}: ${r.created.length} posted, ${r.skipped.length} duplicate/skipped, ${r.review.length} held for review, ${r.errors.length} errors`);
    }
    status.innerHTML=reports.map(x=>`<div class="tag good">${x}</div>`).join('');
    if(typeof loadData==='function') await loadData();
    render();
  }catch(e){status.innerHTML=`<div class="err-msg">${e.message}</div>`;}
}

'neutral'}">${r.approval?'Approver':'Operator'}</span></div>`).join('')}</div></div><div class="form-card" style="margin-top:16px"><div class="section-head"><h3>Recent security evidence</h3><span class="tag neutral">Append-only</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>Time</th><th>Event</th><th>Action</th><th>Resource</th><th>Result</th></tr></thead><tbody>${(d.events||[]).map(e=>`<tr><td>${new Date(e.created_at).toLocaleString()}</td><td>${execEsc(e.event_type)}</td><td>${execEsc(e.action)}</td><td>${execEsc(e.resource||'—')}</td><td><span class="tag ${e.result==='PASS'||e.result==='SUCCESS'?'good':'neutral'}">${execEsc(e.result)}</span></td></tr>`).join('')||'<tr><td colspan=5 class="hint">No recent security events.</td></tr>'}</tbody></table></div></div><div class="narrative" style="margin-top:16px"><b>Security principle:</b> the accounting ledger remains the source of truth; AI and automation can recommend or prepare actions, while authentication, branch RBAC, approvals, period controls and audit evidence govern execution.</div>`;document.getElementById('btn-security-smoke')?.addEventListener('click',async()=>{const b=document.getElementById('btn-security-smoke');b.disabled=true;b.textContent='Testing…';try{const rr=await apiFetch('/api/security-center',{method:'POST',headers:JSONH,body:JSON.stringify({action:'run_smoke_test'})});const x=await rr.json();if(!rr.ok)throw new Error(x.error||'Security test failed');alert(`Security control test: ${x.score}%`);await loadSecurityCenter();}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='Run control test';}});}catch(e){out.innerHTML=`<div class="err-msg">${execEsc(e.message)}</div>`;}}

function renderCloseMonthModal(d){
  if(!confirmCloseMonth) return '';
  return `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h3>Close ${monthLabel(d.ym)}?</h3>
        <div class="sub" style="color:var(--muted); font-size:13.5px;">This snapshots the totals below into the Trend Archive. ${monthLabel(d.ym)} will then be locked — new entries for this month will be blocked.</div>
        <div class="totals">
          <div><span>Total Revenue</span><b class="num">${KES(d.totalRevenue)}</b></div>
          <div><span>Profit Reserved</span><b class="num">${KES(d.alloc.profit)}</b></div>
          <div><span>Owner Pay &amp; Debt</span><b class="num">${KES(d.alloc.owner_debt)}</b></div>
          <div><span>Tax Reserve</span><b class="num">${KES(d.alloc.tax)}</b></div>
          <div><span>OpEx Budget</span><b class="num">${KES(d.alloc.opex)}</b></div>
          <div><span>Actual OpEx (net)</span><b class="num">${KES(d.netOpex)}</b></div>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" id="btn-cancel-close">Cancel</button>
          <button class="btn gold" id="btn-confirm-close">Confirm &amp; Archive</button>
        </div>
      </div>
    </div>
  `;
}

function doCloseMonth(){
  const d = dashboardData();
  state.monthlyArchive.push({
    id: uid(), month: d.ym, month_label: monthLabel(d.ym),
    total_revenue_kes: d.totalRevenue,
    daily_avg_revenue_kes: d.daysElapsed? d.totalRevenue/d.daysElapsed : 0,
    profit_reserved_kes: d.alloc.profit,
    owner_pay_allocated_kes: d.alloc.owner_debt,
    tax_reserve_kes: d.alloc.tax,
    opex_budget_kes: d.alloc.opex,
    actual_opex_kes: d.netOpex,
    opex_running_balance_kes: d.alloc.opex - d.netOpex,
    net_cash_to_ops_kes: d.totalRevenue - d.netOpex - d.alloc.profit - d.alloc.owner_debt - d.alloc.tax + (d.alloc.opex-d.netOpex),
    opex_ratio_pct: d.totalRevenue? (d.netOpex/d.totalRevenue)*100 : 0,
    revenue_achievement_pct: d.target? (d.totalRevenue/d.target)*100 : 0
  });
  state.closedMonths.push(d.ym);
  confirmCloseMonth = false;
  queueSave();
  render();
}

async function handleExpenseImport(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('import-status');
  if(statusEl) statusEl.innerHTML = `<span class="hint">Reading ${file.name}…</span>`;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array', cellDates:true});
    const wsName = wb.SheetNames.find(n=>/expense|tende/i.test(n)) || wb.SheetNames[0];
    const ws = wb.Sheets[wsName];
    const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});

    const wants = {
      date: /^date$/i,
      txn_ref: /txn.*ref|reference/i,
      account_used: /account/i,
      category: /categor/i,
      description: /descri/i,
      paid_to: /paid ?to/i,
      amount_kes: /^amount\b|amount.*kes/i,
      charges_kes: /charge/i,
      owner_funded: /owner.*funded|related.?party/i
    };

    let headerRowIdx = -1, headerMap = {};
    for(let r=0;r<Math.min(grid.length,25);r++){
      const row = grid[r]||[];
      const rowStr = row.map(c=>String(c||'').trim());
      const hasDate = rowStr.some(c=>/^date$/i.test(c));
      const hasAmount = rowStr.some(c=>/amount/i.test(c));
      if(hasDate && hasAmount){
        headerRowIdx = r;
        row.forEach((cell,ci)=>{
          const c = String(cell||'').trim();
          for(const [key,re] of Object.entries(wants)){
            if(re.test(c) && !(key in headerMap)) headerMap[key]=ci;
          }
        });
        break;
      }
    }
    if(headerRowIdx===-1){
      importResult = {imported:0, skippedDupe:0, skippedInvalid:0, errors:['Could not find a header row containing a "Date" column and an "Amount" column — check the file matches the expected layout.']};
      if(statusEl) statusEl.innerHTML='';
      render(); return;
    }

    let imported=0, skippedDupe=0, skippedInvalid=0; const errors=[];
    const seenRefs = new Set(state.expenses.map(e=>e.txn_ref.toLowerCase()));
    const newRows = [];
    for(let r=headerRowIdx+1;r<grid.length;r++){
      const row = grid[r]||[];
      if(row.every(c=>c===null||c==='')) continue;
      const rawDate = headerMap.date!=null ? row[headerMap.date] : null;
      const rawRef = headerMap.txn_ref!=null ? row[headerMap.txn_ref] : null;
      const rawAmount = headerMap.amount_kes!=null ? row[headerMap.amount_kes] : null;
      if(rawDate==null || rawAmount==null || rawRef==null || String(rawRef).trim()===''){
        skippedInvalid++; continue;
      }
      let dateObj = rawDate instanceof Date ? rawDate : new Date(rawDate);
      if(isNaN(dateObj)){ skippedInvalid++; continue; }
      const dateStr = dateObj.toISOString().slice(0,10);
      const txn_ref = String(rawRef).trim();
      if(seenRefs.has(txn_ref.toLowerCase())){
        skippedDupe++; errors.push(`Row ${r+1}: Txn Ref "${txn_ref}" already exists — skipped`); continue;
      }
      const amount = Number(String(rawAmount).replace(/[^0-9.\-]/g,'')) || 0;
      const charges = headerMap.charges_kes!=null ? (Number(String(row[headerMap.charges_kes]||'0').replace(/[^0-9.\-]/g,''))||0) : 0;
      const ownerRaw = headerMap.owner_funded!=null ? String(row[headerMap.owner_funded]||'').trim().toUpperCase() : '';
      newRows.push({
        id:uid(), date:dateStr, txn_ref,
        account_used: headerMap.account_used!=null && row[headerMap.account_used] ? row[headerMap.account_used] : 'Bank Account',
        category: headerMap.category!=null && row[headerMap.category] ? row[headerMap.category] : 'Other',
        description: headerMap.description!=null ? (row[headerMap.description]||'') : '',
        paid_to: headerMap.paid_to!=null ? (row[headerMap.paid_to]||'') : '',
        amount_kes: amount, charges_kes: charges,
        owner_funded: ownerRaw==='Y'||ownerRaw==='YES'||ownerRaw==='TRUE'
      });
      seenRefs.add(txn_ref.toLowerCase());
      imported++;
    }
    // Insert in date order, oldest first -- matches how the original spreadsheet was arranged
    newRows.sort((a,b)=>a.date<b.date?-1:1);

    // Send the whole batch through the bulk import endpoint rather than
    // letting the generic background sync create them one at a time — this
    // re-checks duplicates server-side too (catches anything imported by
    // someone else since this session loaded) and reports exactly what it
    // skipped and why.
    let confirmedRows = [];
    if(newRows.length){
      if(statusEl) statusEl.innerHTML = `<span class="hint">Saving ${newRows.length} rows…</span>`;
      try{
        const entries = newRows.map(CORE_ENTITY_CONFIG.expenses.toApi);
        const apiResult = await apiCreate('/api/expenses', { branch_id: state.branchId, entries });
        const insertedIds = new Set((apiResult.inserted||[]).map(x=>x.id));
        confirmedRows = newRows.filter(r=>insertedIds.has(r.id));
        for(const skip of (apiResult.skipped||[])){
          skippedDupe++;
          errors.push(skip.reason || 'A row was skipped by the server.');
        }
      }catch(err){
        importResult = {imported:0, skippedDupe, skippedInvalid, errors:[...errors, 'Save failed: '+err.message]};
        if(statusEl) statusEl.innerHTML='';
        render();
        ev.target.value = '';
        return;
      }
    }
    state.expenses = state.expenses.concat(confirmedRows);
    // Keep the sync snapshot in step so the debounced background save
    // doesn't try to re-create rows that are already persisted.
    if(lastSynced) lastSynced.expenses = JSON.parse(JSON.stringify(state.expenses));
    importResult = {imported: confirmedRows.length, skippedDupe, skippedInvalid, errors};
    render();
  } catch(err){
    importResult = {imported:0, skippedDupe:0, skippedInvalid:0, errors:['Could not read this file: '+err.message]};
    render();
  }
  ev.target.value = '';
}

let branchCompareState = { loading:false, rows:null, error:null };
async function loadBranchCompare(){
  branchCompareState = { loading:true, rows:null, error:null };
  render();
  try{
    const ym = currentOpenMonth();
    const rows = await Promise.all(state.allBranches.map(async b => {
      const [revRes, expRes] = await Promise.all([
        apiList('/api/revenue', b.branch_id),
        apiList('/api/expenses', b.branch_id)
      ]);
      const revenue = (revRes.revenue||[]).filter(r=>monthKey(r.entry_date)===ym).reduce((s,r)=>s+Number(r.amount_kes),0);
      const expenses = (expRes.expenses||[])
        .filter(e=>monthKey(e.expense_date)===ym && e.status!=='pending_approval' && e.status!=='rejected')
        .reduce((s,e)=>s+Number(e.amount_kes)+Number(e.charges_kes||0),0);
      return { branch_id: b.branch_id, name: b.name, revenue, expenses };
    }));
    branchCompareState = { loading:false, rows, error:null };
  }catch(e){
    branchCompareState = { loading:false, rows:null, error:e.message };
  }
  render();
}

let chartRefs = {};
function drawArchiveCharts(){
  const rows = state.monthlyArchive.slice().sort((a,b)=>a.month<b.month?-1:1);

  Object.values(chartRefs).forEach(c=>c && c.destroy());
  if(!window.Chart || rows.length===0){ chartRefs={}; return; }
  const inkSoft = '#3B4B63', gold='#D9A441', good='#2F7A5C';
  chartRefs.revOpex = new Chart(document.getElementById('chart-rev-opex'), {
    type:'bar',
    data:{labels, datasets:[
      {label:'Revenue', data:rows.map(r=>r.total_revenue_kes), backgroundColor:gold},
      {label:'Net OpEx', data:rows.map(r=>r.actual_opex_kes), backgroundColor:inkSoft}
    ]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}}
  });
  chartRefs.ratio = new Chart(document.getElementById('chart-opex-ratio'), {
    type:'line', data:{labels, datasets:[{label:'OpEx Ratio %', data:rows.map(r=>r.opex_ratio_pct), borderColor:inkSoft, tension:.3}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}

  chartRefs.achv = new Chart(document.getElementById('chart-rev-achieve'), {

  });
}

/* ---------------- Event wiring ---------------- */

function wireTab(){
  // Daily
  const fd = document.getElementById('form-daily');
  if(fd) fd.addEventListener('submit', e => {
    e.preventDefault();
    const fdata = new FormData(fd);
    const date = fdata.get('date');
    const revenue_kes = Number(fdata.get('revenue_kes'));
    const notes = fdata.get('notes')||'';
    const errEl = document.getElementById('daily-err');
    if(state.closedMonths.includes(monthKey(date))){
      errEl.innerHTML = `<div class="err-msg">This date belongs to ${monthLabel(monthKey(date))}, which is already closed.</div>`; return;
    }
    const dupe = state.dailyRevenue.find(r=>r.date===date && r.id!==editingRevenueId);
    if(dupe){
      errEl.innerHTML = `<div class="err-msg">A revenue entry already exists for ${date}. Edit or delete it first — duplicates aren't allowed.</div>`; return;
    }
    if(editingRevenueId){
      const rec = state.dailyRevenue.find(r=>r.id===editingRevenueId);
      if(rec){ rec.date=date; rec.revenue_kes=revenue_kes; rec.notes=notes; }
      editingRevenueId = null;
    } else {
      state.dailyRevenue.push({id:uid(), date, revenue_kes, notes});
    }
    queueSave(); render();
  });
  document.querySelectorAll('[data-edit-revenue]').forEach(b=>b.addEventListener('click',()=>{
    editingRevenueId = b.dataset.editRevenue; render();
  }));
  document.querySelectorAll('[data-del-revenue]').forEach(b=>b.addEventListener('click',()=>{
    if(editingRevenueId===b.dataset.delRevenue) editingRevenueId=null;
    state.dailyRevenue = state.dailyRevenue.filter(r=>r.id!==b.dataset.delRevenue); queueSave(); render();
  }));
  const cancelDaily = document.getElementById('cancel-edit-daily');
  if(cancelDaily) cancelDaily.addEventListener('click', ()=>{ editingRevenueId=null; render(); });

  // Expenses
  const fe = document.getElementById('form-expense');
  if(fe) fe.addEventListener('submit', e => {
    e.preventDefault();
    const fdata = new FormData(fe);
    const date = fdata.get('date');
    const txn_ref = (fdata.get('txn_ref')||'').trim();
    const errEl = document.getElementById('expense-err');
    if(state.closedMonths.includes(monthKey(date))){
      errEl.innerHTML = `<div class="err-msg">This date belongs to ${monthLabel(monthKey(date))}, which is already closed.</div>`; return;
    }
    if(!txn_ref){ errEl.innerHTML = `<div class="err-msg">Txn Ref is required.</div>`; return; }
    const dupe = state.expenses.find(x=>x.txn_ref.toLowerCase()===txn_ref.toLowerCase() && x.id!==editingExpenseId);
    if(dupe){
      errEl.innerHTML = `<div class="err-msg">Txn Ref "${txn_ref}" already exists — duplicate rejected.</div>`; return;
    }
    const needsApprovalEl = fe.querySelector('[name=needs_approval]');
    const payload = {
      date, txn_ref, account_used:fdata.get('account_used'), category:fdata.get('category'),
      description:fdata.get('description')||'', paid_to:fdata.get('paid_to')||'',
      amount_kes:Number(fdata.get('amount_kes')), charges_kes:Number(fdata.get('charges_kes')||0),
      owner_funded: fe.querySelector('[name=owner_funded]').checked,
      status: needsApprovalEl && needsApprovalEl.checked ? 'pending_approval' : 'posted'
    };
    if(editingExpenseId){
      const rec = state.expenses.find(x=>x.id===editingExpenseId);
      if(rec) Object.assign(rec, payload);
      editingExpenseId = null;
    } else {
      state.expenses.push({id:uid(), ...payload});
    }
    queueSave(); render();
  });
  document.querySelectorAll('[data-edit-expense]').forEach(b=>b.addEventListener('click',()=>{
    editingExpenseId = b.dataset.editExpense; render();
  }));
  document.querySelectorAll('[data-del-expense]').forEach(b=>b.addEventListener('click',()=>{
    if(editingExpenseId===b.dataset.delExpense) editingExpenseId=null;
    state.expenses = state.expenses.filter(x=>x.id!==b.dataset.delExpense); queueSave(); render();
  }));
  document.querySelectorAll('[data-attach-expense]').forEach(b=>b.addEventListener('click',()=>{
    openAttachments('expense', b.dataset.attachExpense);
  }));
  wireAttachmentsPanel();
  const exportExpBtn = document.getElementById('btn-export-expenses-csv');
  if(exportExpBtn) exportExpBtn.addEventListener('click', exportExpensesCsv);
  const exportExpXlsxBtn = document.getElementById('btn-export-expenses-xlsx');
  if(exportExpXlsxBtn) exportExpXlsxBtn.addEventListener('click', exportExpensesXlsx);
  const exportRevBtn = document.getElementById('btn-export-revenue-csv');
  if(exportRevBtn) exportRevBtn.addEventListener('click', exportRevenueCsv);
  const assistantForm = document.getElementById('form-assistant');
  document.querySelectorAll('[data-cfo-quick]').forEach(b=>b.addEventListener('click',()=>askAssistant(b.dataset.cfoQuick)));
  document.querySelectorAll('[data-cfo-confirm]').forEach(b=>b.addEventListener('click',async()=>{try{const r=await apiFetch('/api/ai-action',{method:'POST',headers:JSONH,body:JSON.stringify({branch_id:state.branchId,action_id:b.dataset.cfoConfirm,confirm:true})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Action was not executed.');assistantMessages.push({role:'assistant',content:'Controlled action processed: '+JSON.stringify(d),classification:'CALCULATION'});render();}catch(e){assistantError=e.message;render();}}));
  document.querySelectorAll('[data-cfo-cancel]').forEach(b=>b.addEventListener('click',async()=>{try{await apiFetch('/api/ai-action',{method:'POST',headers:JSONH,body:JSON.stringify({branch_id:state.branchId,action_id:b.dataset.cfoCancel,confirm:false})});assistantMessages.push({role:'assistant',content:'The proposed action was cancelled and no ledger mutation was performed.',classification:'FACT'});render();}catch(e){assistantError=e.message;render();}}));
  if(assistantForm) assistantForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = new FormData(assistantForm).get('question');
    if(q && q.trim()) askAssistant(q.trim());
    assistantForm.reset();
  });
  const cancelExpense = document.getElementById('cancel-edit-expense');
  if(cancelExpense) cancelExpense.addEventListener('click', ()=>{ editingExpenseId=null; render(); });
  const addCat = document.getElementById('btn-add-category');
  if(addCat) addCat.addEventListener('click', ()=>{
    const name = (prompt('New expense category name:')||'').trim();
    if(!name) return;
    if(!state.categories) state.categories = DEFAULT_CATEGORIES.slice();
    if(!state.categories.some(c=>c.toLowerCase()===name.toLowerCase())) state.categories.push(name);
    queueSave(); render();
    setTimeout(()=>{ const sel = document.querySelector('[name=category]'); if(sel) sel.value = name; }, 0);
  });

  function parseCsvStatement(text){
    const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
    if(lines.length<2) return [];
    const parseLine=line=>{let out=[],cur='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++;}else quote=!quote;}else if(c===','&&!quote){out.push(cur.trim());cur='';}else cur+=c;}out.push(cur.trim());return out;};
    const headers=parseLine(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]+/g,'_'));
    const pick=(obj,names)=>{for(const n of names){if(obj[n]!=null&&obj[n]!=='')return obj[n];}return '';};
    return lines.slice(1).map((line,idx)=>{const vals=parseLine(line),o={};headers.forEach((h,i)=>o[h]=vals[i]||'');
      const date=pick(o,['date','transaction_date','transactiondate','value_date','valuedate','posted_date']);
      let amountRaw=pick(o,['amount','transaction_amount','value','net_amount','debit','credit']);
      let direction=pick(o,['direction','type','transaction_type']).toLowerCase();
      const debit=pick(o,['debit','withdrawal','debit_amount']), credit=pick(o,['credit','deposit','credit_amount']);
      if(!direction && debit) direction='out'; if(!direction && credit) direction='in';
      if(!amountRaw && (debit||credit)) amountRaw=debit||credit;
      amountRaw=String(amountRaw).replace(/[^0-9.-]/g,'');
      if(debit && !credit) amountRaw=String(debit).replace(/[^0-9.-]/g,'');
      if(credit && !debit) amountRaw=String(credit).replace(/[^0-9.-]/g,'');
      if(direction==='debit'||direction==='withdrawal'||direction==='outflow')direction='out'; if(direction==='credit'||direction==='deposit'||direction==='inflow')direction='in';
      const reference=pick(o,['reference','transaction_reference','transaction_ref','receipt','receipt_number','trxid','transaction_id']);
      const description=pick(o,['description','details','narration','remarks','particulars']);
      const balance=pick(o,['balance','running_balance','closing_balance']);
      return {row_number:idx+2,date,amount:Math.abs(Number(amountRaw||0)),direction:direction==='out'?'out':'in',reference,description,balance};
    }).filter(r=>r.date&&r.amount>0);
  }

  }));
  document.querySelectorAll('[data-tax-dueday]').forEach(el=>el.addEventListener('change',()=>{
    const t = state.taxObligations.find(x=>x.id===el.dataset.taxDueday); t.due_day_of_month = Number(el.value); queueSave();
  }));
  document.querySelectorAll('[data-tax-manualdue]').forEach(el=>el.addEventListener('change',()=>{
    const t = state.taxObligations.find(x=>x.id===el.dataset.taxManualdue); t.manual_next_due_date = el.value; queueSave(); render();
  }));
  document.querySelectorAll('[data-tax-amount]').forEach(el=>el.addEventListener('change',()=>{
    const t = state.taxObligations.find(x=>x.id===el.dataset.taxAmount); t.estimated_amount_kes = Number(el.value); queueSave(); render();
  }));
  document.querySelectorAll('[data-tax-authority]').forEach(el=>el.addEventListener('change',()=>{
    const t = state.taxObligations.find(x=>x.id===el.dataset.taxAuthority); t.filing_authority = el.value; queueSave();
  }));
  document.querySelectorAll('[data-del-tax]').forEach(b=>b.addEventListener('click',()=>{
    state.taxObligations = state.taxObligations.filter(t=>t.id!==b.dataset.delTax); queueSave(); render();
  }));
  const addTax = document.getElementById('btn-add-tax');
  if(addTax) addTax.addEventListener('click', ()=>{
    const name = prompt('Custom tax type name:'); if(!name) return;
    state.taxObligations.push({id:uid(), tax_type:name, applicable:true, frequency:'Monthly', due_day_of_month:20, manual_next_due_date:'', estimated_amount_kes:0, filing_authority:'KRA', notes:''});
    queueSave(); render();
  });

  // Dashboard close-month
  const btnClose = document.getElementById('btn-close-month');
  if(btnClose) btnClose.addEventListener('click', ()=>{ confirmCloseMonth = true; render(); });
  const btnCancel = document.getElementById('btn-cancel-close');
  if(btnCancel) btnCancel.addEventListener('click', ()=>{ confirmCloseMonth = false; render(); });
  const btnConfirm = document.getElementById('btn-confirm-close');
  if(btnConfirm) btnConfirm.addEventListener('click', doCloseMonth);
  const btnPrint = document.getElementById('btn-print-report');
  if(btnPrint) btnPrint.addEventListener('click', ()=> window.print());

  // Settings
  const fs = document.getElementById('form-settings');
  if(fs) fs.addEventListener('submit', e=>{
    e.preventDefault(); const fdata = new FormData(fs);
    const p = Number(fdata.get('pct_profit')), o=Number(fdata.get('pct_owner_debt')), t=Number(fdata.get('pct_tax')), x=Number(fdata.get('pct_opex'));
    const errEl = document.getElementById('settings-err');
    if(Math.round((p+o+t+x)*100)/100 !== 100){ errEl.innerHTML = `<div class="err-msg">Percentages must sum to exactly 100% (currently ${p+o+t+x}%).</div>`; return; }
    state.settings.pct_profit=p; state.settings.pct_owner_debt=o; state.settings.pct_tax=t; state.settings.pct_opex=x;
    state.settings.debt_paydown_split_pct = Number(fdata.get('debt_paydown_split_pct'));
    state.settings.monthly_revenue_target_kes = Number(fdata.get('monthly_revenue_target_kes'));
    state.settings.opening_opex_account_balance_kes = Number(fdata.get('opening_opex_account_balance_kes'));
    queueSave(); render();
  });
  document.querySelectorAll('[data-del-category]').forEach(b=>b.addEventListener('click',()=>{
    const name = b.dataset.delCategory;
    if(state.expenses.some(e=>e.category===name)){
      alert(`Can't remove "${name}" — it's used by existing expenses. Recategorize those first.`);
      return;
    }
    state.categories = CATS().filter(c=>c!==name);
    queueSave(); render();
  }));
  const addCatSettings = document.getElementById('btn-add-category-settings');
  if(addCatSettings) addCatSettings.addEventListener('click', ()=>{
    const name = (prompt('New expense category name:')||'').trim();
    if(!name) return;
    if(!state.categories) state.categories = DEFAULT_CATEGORIES.slice();
    if(!state.categories.some(c=>c.toLowerCase()===name.toLowerCase())) state.categories.push(name);
    queueSave(); render();
  });
  const btnExport = document.getElementById('btn-export');
  if(btnExport) btnExport.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'happynet-export.json'; a.click();
    URL.revokeObjectURL(url);
  });
}

async function startApp(){
  const s = getSession();
  if(!s){ renderLogin(); return; }
  currentUserEmail = s.user ? s.user.email : '';
  root().innerHTML = `<div class="loading-screen">Loading Happynet…</div>`;
  try{
    await loadState();
  }catch(e){
    renderLogin(e.message || 'Your session expired — please sign in again.');
    return;
  }
  render();
}

(async function boot(){
  const s = getSession();
  if(!s){
    const oauthHandled = await handleOAuthCallback();
    if(oauthHandled){ await startApp(); return; }
    renderLogin();
    return;
  }
  await startApp();
})();
</script>
