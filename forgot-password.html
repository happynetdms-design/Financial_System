<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Happynet</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h2>Reset Password</h2>
    <p class="auth-subtitle">Enter your email to receive a recovery link</p>

    <form id="forgotForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com" autocomplete="username" />
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">Send Reset Link</button>
    </form>

    <div id="statusMsg" class="status-message"></div>

    <div class="auth-footer">
      Remembered your password? <a href="/index.html">Sign In</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-client.js';

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const statusMsg = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      statusMsg.textContent = '';

      const redirectUrl = `${window.location.origin}/reset-password.html`;

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: redirectUrl
      });

      if (error) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      } else {
        statusMsg.style.color = 'green';
        statusMsg.textContent = 'If an account with that email exists, a reset link has been sent.';
      }
    });
  </script>
</body>
</html>
