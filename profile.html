<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Happynet</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h2>User Profile</h2>
    <p class="auth-subtitle" id="userEmail">Loading session...</p>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

    <h3>Change Password</h3>
    <form id="changePasswordForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" minlength="8" required placeholder="At least 8 characters" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" minlength="8" required placeholder="Repeat new password" autocomplete="new-password" />
      </div>

      <button type="submit" id="updatePwBtn" class="btn-primary">Update Password</button>
    </form>

    <div id="pwStatus" class="status-message"></div>

    <div style="margin-top: 25px;">
      <button id="logoutBtn" style="background-color: #dc3545; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%;">Log Out</button>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-client.js';

    // Guard: Verify user session on load
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = '/index.html';
    } else {
      const fullName = session.user.user_metadata?.full_name || 'User';
      document.getElementById('userEmail').textContent = `${fullName} (${session.user.email})`;
    }

    // Handle Password Update
    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const pwStatus = document.getElementById('pwStatus');
      const updatePwBtn = document.getElementById('updatePwBtn');

      if (newPassword !== confirmPassword) {
        pwStatus.style.color = 'red';
        pwStatus.textContent = 'Passwords do not match.';
        return;
      }

      updatePwBtn.disabled = true;
      updatePwBtn.textContent = 'Updating...';
      pwStatus.textContent = '';

      const { error } = await supabase.auth.updateUser({ password: newPassword });

      if (error) {
        pwStatus.style.color = 'red';
        pwStatus.textContent = error.message;
      } else {
        pwStatus.style.color = 'green';
        pwStatus.textContent = 'Password updated successfully!';
        document.getElementById('changePasswordForm').reset();
      }

      updatePwBtn.disabled = false;
      updatePwBtn.textContent = 'Update Password';
    });

    // Handle Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '/index.html';
    });
  </script>
</body>
</html>
